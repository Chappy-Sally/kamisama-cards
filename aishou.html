<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チャッピー＆サリーの神様相性占い</title>
</head>
<body>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: linear-gradient(180deg, #fdf3ff 0%, #fff7ee 100%); color: #4a3560; padding: 16px 12px 28px; }
  .wrap { max-width: 430px; margin: 0 auto; }
  h1 { font-size: 21px; text-align: center; color: #7b4b9e; line-height: 1.4; }
  .sub { text-align: center; font-size: 13px; color: #a07bb8; margin: 4px 0 14px; }
  .card { background: #fff; border: 2px solid #eed9f7; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(150,100,180,.08); }
  .card h2 { font-size: 15px; color: #7b4b9e; margin-bottom: 8px; }
  label { font-size: 12px; color: #8a6aa8; display: block; margin: 8px 0 4px; }
  input[type="date"], input[type="text"] { width: 100%; font-size: 16px; padding: 10px; border: 1.5px solid #ddc4ee; border-radius: 10px; background: #fdfaff; color: #4a3560; }
  .rels { display: flex; gap: 8px; margin-top: 4px; }
  .rel { flex: 1; text-align: center; padding: 10px 2px; border: 1.5px solid #ddc4ee; border-radius: 999px; font-size: 13px; background: #fff; cursor: pointer; color: #7b4b9e; }
  .rel.on { background: #9b59c9; color: #fff; border-color: #9b59c9; font-weight: bold; }
  .go { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; color: #fff; background: linear-gradient(90deg, #b06fc9, #e58bb1); border: none; border-radius: 999px; cursor: pointer; margin-top: 4px; box-shadow: 0 3px 10px rgba(180,110,200,.35); }
  .go:active { transform: scale(.98); }
  #result { display: none; }
  .pair { display: flex; align-items: flex-start; gap: 10px; }
  .person { flex: 1; text-align: center; }
  .person img { width: 100%; border-radius: 14px; border: 3px solid #e3c8f5; box-shadow: 0 4px 14px rgba(150,100,180,.25); }
  .cards-title { text-align: center; font-size: 14px; font-weight: bold; color: #7b4b9e; margin-bottom: 10px; }
  .pname { font-size: 12px; color: #8a6aa8; margin-top: 6px; }
  .gname { font-size: 15px; font-weight: bold; color: #6d3f92; }
  .gnum { font-size: 11px; color: #b28bcc; }
  .gkw { font-size: 11px; color: #9b59c9; margin-top: 4px; }
  .gintro { font-size: 11.5px; color: #6d5580; line-height: 1.6; margin-top: 3px; text-align: left; }
  .heart { font-size: 24px; align-self: center; padding-top: 70px; }
  .score { text-align: center; margin: 14px 0 4px; }
  .score .mark { font-size: 54px; font-weight: bold; color: #e05780; line-height: 1; }
  .score .label { font-size: 16px; font-weight: bold; color: #7b4b9e; margin-top: 4px; }
  .comment { font-size: 14px; line-height: 1.8; background: #fdf6ff; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .links { margin-top: 14px; display: grid; gap: 8px; }
  .links a { display: block; text-align: center; padding: 12px; border-radius: 12px; text-decoration: none; font-size: 14px; font-weight: bold; }
  .links .book { background: #fff3d6; color: #8a6414; border: 1.5px solid #f0d48a; }
  .links .app { background: #e9f7ee; color: #2e7d4f; border: 1.5px solid #a9d8ba; }
  .foot { text-align: center; font-size: 11px; color: #bfa8cf; margin-top: 16px; line-height: 1.7; }
  .err { color: #d3547a; font-size: 13px; text-align: center; min-height: 18px; margin-top: 6px; }
</style>
<div class="wrap">
  <h1>チャッピー＆サリーの<br>神様相性占い</h1>
  <p class="sub">✨ 神様占い ✨<br>誕生日から割り出す守り神で、ふたりの相性を診断するよ</p>

  <div class="card">
    <h2>あなた</h2>
    <label>お名前（任意）</label>
    <input type="text" id="nameA" placeholder="あなた">
    <label>誕生日</label>
    <input type="date" id="birthA">
  </div>

  <div class="card">
    <h2>お相手</h2>
    <label>お名前（任意）</label>
    <input type="text" id="nameB" placeholder="お相手">
    <label>誕生日</label>
    <input type="date" id="birthB">
  </div>

  <div class="card">
    <h2>ふたりの関係は？</h2>
    <div class="rels">
      <div class="rel on" data-rel="love">💗 恋愛</div>
      <div class="rel" data-rel="partner">💑 パートナー</div>
      <div class="rel" data-rel="business">💼 ビジネス</div>
    </div>
  </div>

  <button class="go" id="goBtn">相性を占う ✨</button>
  <p class="err" id="err"></p>

  <div class="card" id="result">
    <div class="cards-title">✨ ふたりの守り神カード ✨</div>
    <div class="pair">
      <div class="person">
        <img id="imgA" alt="">
        <div class="pname" id="pnameA"></div>
        <div class="gname" id="gnameA"></div>
        <div class="gnum" id="gnumA"></div>
        <div class="gkw" id="kwA"></div>
        <div class="gintro" id="introA"></div>
      </div>
      <div class="heart">💞</div>
      <div class="person">
        <img id="imgB" alt="">
        <div class="pname" id="pnameB"></div>
        <div class="gname" id="gnameB"></div>
        <div class="gnum" id="gnumB"></div>
        <div class="gkw" id="kwB"></div>
        <div class="gintro" id="introB"></div>
      </div>
    </div>
    <div class="score">
      <div class="mark" id="mark"></div>
      <div class="label" id="markLabel"></div>
    </div>
    <div class="comment" id="comment"></div>
    <div class="links">
      <a class="book" href="https://www.amazon.co.jp/dp/B0HSSHG1DQ" target="_blank" rel="noopener">📖 守り神の本『神様カードブック』発売中（Kindle 980円）</a>
      <a class="app" href="https://chappysally.base.shop/items/166786180" target="_blank" rel="noopener">🔮 44柱の神様カードアプリはこちら</a>
    </div>
  </div>

  <p class="foot">守り神は、生年月日の数字を1桁になるまで足して出すよ。<br>相性は『チャッピー＆サリーの神様カードブック』の相性表をもとにしています。</p>
</div>

<script>

  "1-4": "国譲りの昔話がある二人。時間をかけて信頼を育ててきた仲だよ。",

};
var CLOSING = {
  love: {
    "◎": "この気持ち、大切に育ててね。ふたりの時間そのものが開運だよ。",
    "○": "焦らなくて大丈夫。笑顔でいる時間が、距離を縮めてくれるよ。",
    "△": "ペースの違いは悪くないよ。言葉で伝えることを大切にね。",
    "×": "ドキドキは刺激の証拠。相手の世界をのぞく気持ちでいると、発見がいっぱいだよ。"
  },
  partner: {
    "◎": "気持ちを伝え合うほど、絆が深まる組み合わせ。記念日や小さな約束を大切にね。",
    "○": "思いやりの積み重ねが効く二人。「ありがとう」を言葉にすると、もっと温かくなるよ。",
    "△": "すれ違いは、話し合いのサイン。短くても、顔を見て話す時間を作ってね。",

  },

    "×": "ぶつかるのは真剣な証拠。数字と期限で話すと、感情の衝突が減るよ。"
  }
};
var rel = "love";
document.querySelectorAll(".rel").forEach(function(el){
  el.addEventListener("click", function(){
    document.querySelectorAll(".rel").forEach(function(e){ e.classList.remove("on"); });
    el.classList.add("on");
    rel = el.getAttribute("data-rel");
    if (document.getElementById("result").style.display === "block") runDiagnosis();
  });
});
function guardianNum(dateStr){
  var digits = dateStr.replace(/-/g, "");
  var sum = 0;
  for (var i = 0; i < digits.length; i++) sum += parseInt(digits[i], 10);
  while (sum > 9) { var s = 0, t = String(sum); for (var j = 0; j < t.length; j++) s += parseInt(t[j], 10); sum = s; }
  return sum;
}
function imgUrl(card){
  var n = ("0" + card).slice(-2);
  return "https://chappy-sally.github.io/kamisama-cards/card" + n + ".webp";
}
function runDiagnosis(){
  var bA = document.getElementById("birthA").value;
  var bB = document.getElementById("birthB").value;
  var err = document.getElementById("err");
  if (!bA || !bB) { err.textContent = "ふたりの誕生日を入れてね。"; return; }
  err.textContent = "";
  var nA = guardianNum(bA), nB = guardianNum(bB);
  var gA = GODS[nA], gB = GODS[nB];
  var nameA = document.getElementById("nameA").value || "あなた";
  var nameB = document.getElementById("nameB").value || "お相手";
  document.getElementById("imgA").src = imgUrl(gA.card);
  document.getElementById("imgB").src = imgUrl(gB.card);
  document.getElementById("pnameA").textContent = nameA;
  document.getElementById("pnameB").textContent = nameB;
  document.getElementById("gnameA").textContent = gA.name;
  document.getElementById("gnameB").textContent = gB.name;
  document.getElementById("gnumA").textContent = "守り神ナンバー " + nA;
  document.getElementById("gnumB").textContent = "守り神ナンバー " + nB;
  document.getElementById("kwA").textContent = gA.kws;
  document.getElementById("kwB").textContent = gB.kws;
  document.getElementById("introA").textContent = gA.intro;
  document.getElementById("introB").textContent = gB.intro;
  var mark = MATRIX[nA][nB - 1];
  document.getElementById("mark").textContent = mark;
  document.getElementById("markLabel").textContent = LABELS[mark];
  var key = Math.min(nA, nB) + "-" + Math.max(nA, nB);
  var base;
  if (nA === nB) {
    base = "同じ守り神同士！価値観がそっくりで、説明しなくても分かり合える特別な相性だよ。";
  } else if (SPECIAL[key]) {
    base = SPECIAL[key];
  } else {
    base = gA.kw + "の" + gA.name + "と、" + gB.kw + "の" + gB.name + "。ふたりの力がやさしく響き合う、相性のいい組み合わせだよ。";
  }
  document.getElementById("comment").textContent = base + CLOSING[rel][mark];
  var r = document.getElementById("result");
  r.style.display = "block";
  r.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.getElementById("goBtn").addEventListener("click", runDiagnosis);
</script>

</body>
</html>
